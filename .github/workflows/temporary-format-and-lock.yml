name: One-time formatting and hash lock
on:
  push:
    branches: [Milestone3]
    paths: [.github/workflows/temporary-format-and-lock.yml]
permissions:
  contents: write

jobs:
  format-and-lock:
    if: github.event.head_commit.message == 'maintenance-format-and-hash-lock'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install existing pinned environment and coverage
        run: |
          python -m pip install --disable-pip-version-check -r requirements-repro-py312.txt
          python -m pip install --disable-pip-version-check 'coverage>=7,<8'
      - name: Apply consistent Ruff formatting
        run: |
          python -m ruff format --target-version py310 scripts tests
          python -m ruff format --check --target-version py310 scripts tests
      - name: Generate SHA256-locked Linux/Python 3.12 requirements
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from packaging.utils import canonicalize_name, parse_sdist_filename, parse_wheel_filename

          path = Path("requirements-repro-py312.txt")
          requirements = [
              line.strip()
              for line in path.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          version = importlib.metadata.version("coverage")
          requirements = [line for line in requirements if not line.startswith("coverage==")]
          requirements.append(f"coverage=={version}")
          requirements.sort(key=lambda line: canonicalize_name(line.split("==", 1)[0]))
          assert all(re.fullmatch(r"[a-zA-Z0-9_.-]+==[a-zA-Z0-9_.!+]+", line) for line in requirements)

          with tempfile.TemporaryDirectory() as temp:
              directory = Path(temp)
              unverified = directory / "requirements.txt"
              unverified.write_text("\n".join(requirements) + "\n", encoding="utf-8")
              wheelhouse = directory / "distributions"
              wheelhouse.mkdir()
              subprocess.run(
                  [sys.executable, "-m", "pip", "download", "--disable-pip-version-check",
                   "--no-deps", "-d", str(wheelhouse), "-r", str(unverified)],
                  check=True,
              )
              by_package = {}
              for item in wheelhouse.iterdir():
                  try:
                      name, version, _, _ = parse_wheel_filename(item.name)
                  except ValueError:
                      name, version = parse_sdist_filename(item.name)
                  key = (canonicalize_name(name), str(version))
                  if key in by_package:
                      raise RuntimeError(f"Multiple artifacts for {key}")
                  by_package[key] = hashlib.sha256(item.read_bytes()).hexdigest()
              rows = []
              for req in requirements:
                  name, version = req.split("==", 1)
                  key = (canonicalize_name(name), version)
                  if key not in by_package:
                      raise RuntimeError(f"Missing downloaded artifact for {req}")
                  rows.append(f"{req} --hash=sha256:{by_package[key]}")
              assert len(rows) == len(by_package), "Unaccounted downloaded artifacts"
          header = [
              "# Python 3.12 / Ubuntu 24.04 (Linux x86_64): pinned with SHA256 hashes.",
              "# Generated from the previously verified pinned versions without upgrades.",
              "# Other platforms/Python versions use requirements-dev.txt.",
              "# Recreate the hashes only after independently checking downloaded artifacts.",
          ]
          path.write_text("\n".join(header + rows) + "\n", encoding="utf-8")
          print(f"Locked {len(rows)} distributions with SHA256 hashes")
          PY
      - name: Validate formatting, coverage, and notebook outputs
        run: |
          python -m ruff check scripts tests --isolated --select E4,E7,E9,F,B
          python -m coverage run --source=scripts -m pytest tests -q
          python -m coverage report --fail-under=90
          python -m scripts.refresh_notebooks --check
      - name: Publish formatting and hash lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests requirements-repro-py312.txt
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "style: format Python and hash-lock reproduction dependencies"
          git push origin HEAD:Milestone3
