name: Generate native SHA256 locks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate portable lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Generate, hash-lock, install afresh, and regression-test
        run: python scripts/generate_portable_lock.py
