name: Python checks

on:
  push:
    branches: [Milestone3]
  pull_request:
    branches: [Milestone3]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install supported environment
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install -r requirements-repro-py312.txt
          else
            python -m pip install -r requirements-dev.txt
          fi
      - name: Run regression tests
        run: python -m pytest tests -q
      - name: Verify pinned published experiments
        if: matrix.python-version == '3.12'
        run: |
          python -m scripts.model_training --ticker AAPL
          python -m scripts.refresh_notebooks --check
