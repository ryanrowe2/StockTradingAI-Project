name: Python checks

on:
  push:
    branches: [Milestone3]
  pull_request:
    branches: [Milestone3]

permissions:
  contents: read

jobs:
  verify:
    # These are the protected branch's required checks. Requiring the
    # portable smoke job here makes Windows/macOS failures block merging.
    needs: portable-smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install verified version-specific environment
        run: |
          python -m pip install --require-hashes -r requirements-repro-py${{ matrix.python-version == '3.10' && '310' || matrix.python-version == '3.11' && '311' || '312' }}.txt
      - name: Verify second-audit edge-case regressions
        run: |
          python -m pytest tests/test_second_audit_remediation.py -q
      - name: Run regression tests with coverage
        run: |
          python -m coverage run --branch --source=scripts -m pytest tests -q
          python -m coverage report --fail-under=88
          python -m coverage json -o coverage-summary.json
          python -m scripts.verify_coverage
      - name: Verify both bundled SHA-256 and original publisher Git provenance
        if: matrix.python-version == '3.12'
        run: |
          python -m scripts.verify_source_data
          python -m scripts.verify_upstream_source
      - name: Check Python syntax, lint, and formatting
        run: |
          python -m compileall -q scripts tests
          python -m ruff check scripts tests --isolated --select E4,E7,E9,F,B
          python -m ruff format --check --target-version py310 scripts tests
      - name: Verify pinned published experiments
        if: matrix.python-version == '3.12'
        run: |
          python -m scripts.model_training --ticker AAPL
          python -m scripts.model_training --ticker AAPL --target next_open_to_close --output data/generated/aapl_executable_metrics.json
          python -m scripts.walk_forward_evaluation --ticker AAPL --folds 2 --bootstrap-samples 100 --output data/generated/aapl_walk_forward_metrics.json
          python -m scripts.refresh_notebooks --check
      - name: Reproduce published full-market walk-forward reports
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from scripts.walk_forward_evaluation import walk_forward_experiment

          expected = json.loads(Path("docs/expected_walk_forward.json").read_text())
          expected_folds = json.loads(Path("docs/expected_walk_forward_folds.json").read_text())
          for target in ("close_to_close", "next_open_to_close"):
              result = walk_forward_experiment(target=target, folds=5, bootstrap_samples=1000)
              observed = {
                  "target": target,
                  "majority_accuracy": result["majority_accuracy"],
                  "baseline_accuracy": result["baseline"]["accuracy"],
                  "enhanced_accuracy": result["enhanced"]["accuracy"],
                  "baseline_interval": result["accuracy_lift_over_majority_95pct_block_intervals"]["baseline"],
                  "enhanced_interval": result["accuracy_lift_over_majority_95pct_block_intervals"]["enhanced"],
                  "holdout_observations": result["holdout_observations"],
              }
              assert set(observed) == set(expected[target])
              for field, actual in observed.items():
                  reference = expected[target][field]
                  if isinstance(actual, list):
                      assert len(actual) == len(reference)
                      for value, benchmark in zip(actual, reference, strict=True):
                          assert math.isclose(value, benchmark, rel_tol=0, abs_tol=1e-10), (target, field, actual, reference)
                  elif isinstance(actual, float):
                      assert math.isclose(actual, reference, rel_tol=0, abs_tol=1e-10), (target, field, actual, reference)
                  else:
                      assert actual == reference, (target, field, actual, reference)
              assert result["folds"] == expected_folds[target], (target, "Full five-fold result or prediction SHA256 drift")
              print("FIVE_FOLD_REPORT=" + json.dumps(observed), flush=True)
              print("FIVE_FOLD_DETAIL=" + json.dumps({"target": target, "folds": result["folds"]}, sort_keys=True), flush=True)
          PY

  portable-smoke:
    name: portable smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install portable Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Exercise the complete regression suite on this platform
        run: |
          python -m pytest tests -q
