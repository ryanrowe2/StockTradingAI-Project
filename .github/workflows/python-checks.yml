name: Python checks

on:
  push:
    branches: [Milestone3]
  pull_request:
    branches: [Milestone3]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test and verify reproducibility
        run: |
          python -m pytest tests -q
          python -m scripts.model_training --ticker AAPL
          python -m scripts.refresh_notebooks --check
