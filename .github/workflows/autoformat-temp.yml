name: Autoformat release scripts (temporary)

on:
  push:
    branches: [fix/portable-hash-locks-and-branch-hygiene-20261112]
    paths: [.github/workflows/autoformat-temp.yml]

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Format and statically validate the release additions
        run: |
          python -m pip install ruff==0.17.4
          python -m ruff check --fix scripts/generate_portable_lock.py scripts/cleanup_merged_branches.py tests/test_operational_release.py --isolated --select E4,E7,E9,F,B
          python -m ruff format --target-version py310 scripts/generate_portable_lock.py scripts/cleanup_merged_branches.py tests/test_operational_release.py
          python -m ruff check scripts/generate_portable_lock.py scripts/cleanup_merged_branches.py tests/test_operational_release.py --isolated --select E4,E7,E9,F,B
          python -m ruff format --check --target-version py310 scripts/generate_portable_lock.py scripts/cleanup_merged_branches.py tests/test_operational_release.py
      - name: Commit only the three formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/generate_portable_lock.py scripts/cleanup_merged_branches.py tests/test_operational_release.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified release formatting and lint auto-fixes"
            git push origin HEAD:fix/portable-hash-locks-and-branch-hygiene-20261112
          fi
