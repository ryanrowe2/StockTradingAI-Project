name: Dataset license publisher check (temporary)

on:
  push:
    branches: [fix/portable-hash-locks-and-branch-hygiene-20261112]
    paths: [.github/workflows/license-check-temp.yml]
permissions:
  contents: read
jobs:
  publisher-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request current publisher-selected dataset license
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.error
          targets = [
              "https://www.kaggle.com/api/v1/datasets/view/szrlee/stock-time-series-20050101-to-20171231",
              "https://www.kaggle.com/api/v1/datasets/metadata/szrlee/stock-time-series-20050101-to-20171231",
          ]
          for url in targets:
              print("PUBLISHER_ENDPOINT", url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(250000).decode("utf-8", errors="replace")
                  data = json.loads(body)
                  print("PUBLISHER_METADATA", json.dumps({
                      "ref": data.get("ref"),
                      "id": data.get("id"),
                      "title": data.get("title"),
                      "licenseName": data.get("licenseName"),
                      "license_name": data.get("license_name"),
                      "licenses": data.get("licenses"),
                      "currentVersionNumber": data.get("currentVersionNumber"),
                  }, sort_keys=True), flush=True)
              except Exception as error:
                  print("PUBLISHER_ERROR", type(error).__name__, str(error)[:450], flush=True)
