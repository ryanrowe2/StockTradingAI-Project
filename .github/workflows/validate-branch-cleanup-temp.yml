name: Validate verified branch cleanup (temporary)
on:
  push:
    branches: [fix/retry-verified-branch-cleanup-502-20261112]
    paths: [.github/workflows/validate-branch-cleanup-temp.yml]
permissions:
  contents: write
jobs:
  verified-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify and remove only proven superseded refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cleanup_merged_branches.py --execute
