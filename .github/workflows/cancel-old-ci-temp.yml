name: Cancel superseded PR certifications (temporary)
on:
  push:
    branches: [fix/portable-hash-locks-and-branch-hygiene-20261112]
    paths: [.github/workflows/cancel-old-ci-temp.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-outdated:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel old Python check runs only on this remediation branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repo = os.environ["GH_REPO"]
          branch = "fix/portable-hash-locks-and-branch-hygiene-20261112"
          root = f"https://api.github.com/repos/{repo}/actions/runs"
          headers = {"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "stock-ai-ci-cleaner"}
          req = urllib.request.Request(root + "?branch=" + branch + "&per_page=100", headers=headers)
          with urllib.request.urlopen(req, timeout=25) as resp:
              runs = json.load(resp)["workflow_runs"]
          for run in runs:
              if run.get("name") != "Python checks" or run["status"] == "completed":
                  continue
              target = root + "/" + str(run["id"]) + "/cancel"
              try:
                  req = urllib.request.Request(target, method="POST", data=b"", headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      print("CANCELED", run["id"], run["head_sha"], resp.status)
              except urllib.error.HTTPError as exc:
                  print("CANCEL_RESULT", run["id"], exc.code)
